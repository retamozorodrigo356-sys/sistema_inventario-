services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventario_app
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www
      - /var/www/vendor
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: inventario
      DB_USERNAME: inventario_user
      DB_PASSWORD: inventario_pass
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "false"
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "158195"
      REVERB_APP_KEY: "irmeua1idobpyjxfbuo2"
      REVERB_APP_SECRET: "uluokggk0mpcouopdd6a"
      REVERB_HOST: "localhost"
      REVERB_PORT: "8080"
      REVERB_SCHEME: "http"
    networks:
      - inventario_net
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: inventario_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - inventario_net
    depends_on:
      - app

  db:
    image: mariadb:10.11
    container_name: inventario_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: inventario
      MYSQL_USER: inventario_user
      MYSQL_PASSWORD: inventario_pass
      MYSQL_ROOT_PASSWORD: root_secure_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inventario_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: inventario_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: inventario_user
      PMA_PASSWORD: inventario_pass
    ports:
      - "8081:80"
    networks:
      - inventario_net
    depends_on:
      db:
        condition: service_healthy

networks:
  inventario_net:
    driver: bridge

volumes:
  db_data:
    driver: local
